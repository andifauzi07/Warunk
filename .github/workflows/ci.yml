name: CI

on:
  push:
    branches:
      - '**'
      - '!main'
      - '!dependabot/**'
  pull_request:
    branches: 
      - main
      
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: ESLint
        run: bun run lint
      - name: Prettier check
        run: bun run format:check
  unit-component:
    name: Unit & Component
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run type-check
      - name: Unit & component tests
        run: bun run test
  automerge:
    name: Auto Create & Merge PR
    needs: unit-component
    # Memastikan skrip tidak berjalan langsung di branch main
    if: github.ref_name != 'main' && github.head_ref != 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Create PR and Merge Safely
        run: |
          # SOLUSI UTAMA: Mengambil nama branch asli baik dari event push maupun pull_request
          TARGET_BRANCH="${{ github.head_ref || github.ref_name }}"
          echo "Branch fitur terdeteksi: $TARGET_BRANCH"
          
          # 1. Buat PR baru. Jika sudah ada, ambil URL PR yang sudah terbuka agar tidak eror
          PR_URL=$(gh pr create \
            --base main \
            --head "$TARGET_BRANCH" \
            --title "Auto PR: $TARGET_BRANCH" \
            --body "PR ini dibuat otomatis oleh GitHub Actions setelah semua tes berhasil." 2>/dev/null || gh pr view "$TARGET_BRANCH" --json url --template '{{.url}}')
          
          echo "Link PR: $PR_URL"
          
          # 2. Beri jeda 3 detik agar sistem internal GitHub menyinkronkan data PR
          sleep 3
          
          # 3. Langsung lakukan merge tanpa fitur --auto agar tidak tertahan oleh antrean Vercel
          gh pr merge "$TARGET_BRANCH" --merge --disable-auto
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
