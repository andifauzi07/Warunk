name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-component:
    name: Unit & Component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run type-check
      - name: Unit & component tests
        run: bun run test