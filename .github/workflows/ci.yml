name: CI

on:
  push:
    branches:
      - '**'
      - '!main'
      - '!dependabot/**'
  pull_request:
    branches: 
      - main
      
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: ESLint
        run: bun run lint
      - name: Prettier check
        run: bun run format:check
  unit-component:
    name: Unit & Component
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run type-check
      - name: Unit & component tests
        run: bun run test
  automerge:
    name: Auto Create & Merge PR
    needs: unit-component
    if: github.event_name == 'push' && github.ref_name != 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      # Menggunakan GitHub CLI untuk membuat PR dari branch lokal Anda & mengaktifkan merge commit
      - name: Create PR and Enable Auto-Merge (Keep All Commits)
        run: |
          gh pr create \
            --base main \
            --head ${{ github.ref_name }} \
            --title "Auto PR: ${{ github.ref_name }}" \
            --body "PR ini dibuat otomatis oleh GitHub Actions setelah semua tes berhasil." || true
            
          gh pr merge ${{ github.ref_name }} --auto --merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}